[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "watchkeeper"
version = "0.1.0"
description = "An experimental supervisor for budgeted, multi-day HPC campaigns."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = [
    "pydantic>=2,<3",
    "mcp>=1.28.1,<2",
]

[project.optional-dependencies]
test = [
    "build>=1.2,<2",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[project.urls]
Repository = "https://github.com/tdpham2/watchkeeper"
Issues = "https://github.com/tdpham2/watchkeeper/issues"

[project.scripts]
watchkeeper = "watchkeeper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
