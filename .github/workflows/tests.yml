name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install independent package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip check
      - name: Lint and test
        run: |
          ruff check .
          python -m pytest
      - name: Build source and wheel distributions
        run: python -m build
      - name: Verify wheel in a clean environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/watchkeeper-wheel"
          "$RUNNER_TEMP/watchkeeper-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/watchkeeper-wheel/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/watchkeeper-wheel/bin/python" -I -c \
            "import importlib.util, watchkeeper; assert importlib.util.find_spec('chemgraph') is None; print(watchkeeper.__version__)"
          "$RUNNER_TEMP/watchkeeper-wheel/bin/python" -I -m watchkeeper --help
          "$RUNNER_TEMP/watchkeeper-wheel/bin/watchkeeper" --version
          "$RUNNER_TEMP/watchkeeper-wheel/bin/watchkeeper" init --campaign "$RUNNER_TEMP/campaign"
          "$RUNNER_TEMP/watchkeeper-wheel/bin/python" -I -m watchkeeper validate --campaign "$RUNNER_TEMP/campaign"
